# GitHub

name: My-github-actions
env:
   APLICATION_NAME: "MyFlask"
   PACKAGE_NAME: "Flask_deploy_version-${{ github.sha }}"

on:
   push:
      branches:
         - main

jobs:
  my-testing:
    runs-on: ubuntu-latest
   
    steps:

      - name: Git clone my repo
        uses: actions/checkout@v1
        
      - name: Print Heloo message
        run: echo "Hello world from testing"

      - name: Execute few commands
        run: 
           echo "Hello Message1"
           echo "Hello Message2"
           echo "Aplication name - ${{ env.APLICATION_NAME }}"
      
      - name: List current folder
        run: ls -la

      
        

  my-deploy:
    runs-on: ubuntu-latest
    needs: [my-testing]
    env:
      VAR1 : "THIS IS JOB Label Variebles"
      VAR2 : "THIS IS JOB Label Variebles2"
      
    steps:

      - name: Vars in name
        run: 
          echo " VAR1 = ${{ env.VAR1 }}
          echo " VAR2 = ${{ env.VAR2 }}

      - name: apt update
        run: sudo apt update
      
      - name: Print Heloo message
        run: echo "Hello world from deploy job"

      - name: Deployment package
        run: echo "Deploy package is ${{  env.PACKAGE_NAME }}"

      - name: Lets test some packeges if the are here 1
        run: aws --version

      - name: Lets test some packeges if the are here 2
        run: zip --version
